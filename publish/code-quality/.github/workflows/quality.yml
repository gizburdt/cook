name: Quality

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.ai/**'
  push:
    branches-ignore:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Configure Composer auth
        env:
          TOKEN: ${{ github.token }}
        run: echo "COMPOSER_AUTH={\"github-oauth\":{\"github.com\":\"$TOKEN\"}}" >> "$GITHUB_ENV"

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github

      - name: Run Insights
        if: ${{ !cancelled() }}
        run: php artisan insights --no-interaction --disable-security-check
